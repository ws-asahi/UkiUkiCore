name=ClockOut
version=1.0.0
author=Yusuke Shimizu - Workshop Asahi
maintainer=Yusuke Shimizu - Workshop Asahi <asahi.00@ws-asahi.net>
sentence=Output the main clock (CLK_PER) on the CLKOUT pin of Wazamono boards.
paragraph=Share the board's time base with an external device, feed another MCU's external clock input, or measure the real system clock with a counter. begin()/end() start and stop the output on PA7 (Tachi D8, Tsurugi D2, Kunai D1), refusing to take the pin when AC0, EVOUTA or the SPI select signal already owns it, and isRunning() reports the output being switched off by a clock failure. Clean-room implementation from DS40002548A chapter 12 only.
category=Signal Input/Output
url=https://github.com/ws-asahi/WazamonoCore
architectures=megaavr
