name=Ethernet
version=2.0.2
author=Various (see AUTHORS file for details)
maintainer=Yusuke Shimizu - Workshop Asahi <asahi.00@ws-asahi.net>
sentence=Enables network connection (local and Internet) using the Arduino Ethernet Board or Shield. UkiUkiCore build: SPI clock capped at 8 MHz so W5100 shields work on 12/16/20/24 MHz AVR DU boards; otherwise identical to the stock 2.0.2.
paragraph=With this library you can use the Arduino Ethernet (shield or board) to connect to Internet. The library provides both client and server functionalities. The library permits you to connect to a local network also with DHCP and to resolve DNS.<br/>This copy bundled with UkiUkiCore requests an 8 MHz SPI clock (the stock 14 MHz request rounds to 12 MHz on a 24 MHz AVR DU, which a W5100 cannot follow) and uses atomic OUTSET/OUTCLR writes for the chip select. No other changes are made.
category=Communication
url=https://www.arduino.cc/en/Reference/Ethernet
architectures=megaavr
includes=Ethernet.h
