name=SPISlave
version=1.0.0
author=Yusuke Shimizu - Workshop Asahi
maintainer=Yusuke Shimizu - Workshop Asahi <asahi.00@ws-asahi.net>
sentence=SPI client ("slave") mode for Wazamono boards, with the ESP8266 SPISlave API.
paragraph=Receive SPI transactions as the client device: onData() delivers each transaction when SS returns high, setData() stages the reply the host clocks out. API format follows the SPISlave library bundled with the ESP8266 Arduino core (variable-length transactions instead of fixed 32-byte packets; no status register). Supported on Wazamono Tachi (SS=D4) and Kunai (SS=D1). Clean-room implementation from DS40002548A chapter 26 only.
category=Communication
url=https://github.com/ws-asahi/WazamonoCore
architectures=megaavr
