sentence=UkiUkiduino / UkiUkimicroのオンボード機能(フルカラーLED・ボタン)を体験するサンプル集です。
paragraph=オンボードのフルカラーLED(setBLEDColorで色と明るさを変更、LED_BUILTIN(UkiUkiduino: D13 / UkiUkimicro: D17)で点灯・消灯)とオンボードボタン(BTN_BUILTIN = D32、押下=HIGH)を、配線なしでそのまま試せるサンプルを収録しています。APIはコアに組み込まれているため、このライブラリのincludeは必須ではありません。
